// DNS autoritativo de desarrollo para rutabol.scz (solo uso local).
options {
    directory "/var/cache/bind";
    recursion no;          // solo responde por su zona; no es un resolvedor abierto
    allow-transfer { none; };
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
};

zone "rutabol.scz" {
    type primary;
    file "/etc/bind/db.rutabol.scz";
};
