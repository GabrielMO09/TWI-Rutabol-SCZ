# PostgreSQL de Rutabol-SCZ con volumen persistente y TRES bases en un mismo servidor:
#   rutabol_scz (operacion), registro_academico (instituciones y estudiantes), registro_transporte (lineas, rutas, paradas).
#   docker compose up -d            -> levanta la BD (puerto 5434, no choca con un PG local en 5432)
#   docker compose restart postgres -> los datos sobreviven (volumen "pgdata")
#   docker compose down -v          -> BORRA el volumen y los datos
# Contrasenas: variables de entorno o los valores por defecto de DESARROLLO de abajo (cambiarlos fuera de local).
#   docker compose --profile full up -d --build -> levanta la BD, la API y el frontend
name: rutabol-scz-pg18
services:
  postgres:
    image: postgres:18
    container_name: rutabol-SCZ
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rutabol_scz}
      POSTGRES_USER: ${DB_OWNER_USER:-rutabol_owner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-owner_dev_pass}
      DB_APP_USER: ${DB_APP_USER:-rutabol_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-app_dev_pass}
      DB_ACADEMICO_NAME: ${DB_ACADEMICO_NAME:-registro_academico}
      DB_ACADEMICO_USER: ${DB_ACADEMICO_USER:-academico_app}
      DB_ACADEMICO_PASSWORD: ${DB_ACADEMICO_PASSWORD:-academico_dev_pass}
      DB_TRANSPORTE_NAME: ${DB_TRANSPORTE_NAME:-registro_transporte}
      DB_TRANSPORTE_USER: ${DB_TRANSPORTE_USER:-transporte_app}
      DB_TRANSPORTE_PASSWORD: ${DB_TRANSPORTE_PASSWORD:-transporte_dev_pass}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Solo se ejecuta en el PRIMER arranque (volumen vacio): crea las 3 bases y carga bd/<base>/01_esquema.sql + 02_datos.sql.
      - ./bd:/bd:ro
      - ./bd/00_init_bases.sh:/docker-entrypoint-initdb.d/00_init_bases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # BIND9: resuelve rutabol.scz a 127.0.0.1 (ver scripts/dns-setup.ps1).
  dns:
    image: internetsystemsconsortium/bind9:9.18
    container_name: rutabol-dns
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DNS_PORT:-53}:53/udp"
      - "127.0.0.1:${DNS_PORT:-53}:53/tcp"
    volumes:
      - ./dns/named.conf:/etc/bind/named.conf:ro
      - ./dns/db.rutabol.scz:/etc/bind/db.rutabol.scz:ro
    command: ["-g", "-c", "/etc/bind/named.conf"]

  backend:
    profiles: ["full"]
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3001"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-rutabol_scz}
      DB_APP_USER: ${DB_APP_USER:-rutabol_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-app_dev_pass}
      DB_ACADEMICO_NAME: ${DB_ACADEMICO_NAME:-registro_academico}
      DB_ACADEMICO_USER: ${DB_ACADEMICO_USER:-academico_app}
      DB_ACADEMICO_PASSWORD: ${DB_ACADEMICO_PASSWORD:-academico_dev_pass}
      DB_TRANSPORTE_NAME: ${DB_TRANSPORTE_NAME:-registro_transporte}
      DB_TRANSPORTE_USER: ${DB_TRANSPORTE_USER:-transporte_app}
      DB_TRANSPORTE_PASSWORD: ${DB_TRANSPORTE_PASSWORD:-transporte_dev_pass}
      DB_SSL: "${DB_SSL:-false}"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      TRUST_PROXY: "${TRUST_PROXY:-}"
      CREDENTIAL_SECRET: ${CREDENTIAL_SECRET:-credential_dev_only}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://127.0.0.1:3001/api/health/db\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:

networks:
  default:
    driver: bridge
